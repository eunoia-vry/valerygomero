<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let kilometros = Number(prompt("Ingrese la cantidad de kilómetros a recorrer: "));

        let galones = kilometros / 40;

        document.write("Kilometros a recorrer: " + kilometros + "<br>");
        document.write("Galones necesarios: " + galones);
    </script>
</body>

</html>
