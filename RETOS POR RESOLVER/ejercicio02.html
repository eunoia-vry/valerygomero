<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let precioCuaderno = Number(prompt("Ingrese precio del cuaderno: "));
        let cantidadCuaderno = Number(prompt("Ingrese cantidad de cuaderno: "));
        let precioLapicero = Number(prompt("Ingrese precio de lapicero: "));
        let cantidadLapicero = Number(prompt("Ingrese cantidad de lapicero: "));
        let total = (precioCuaderno * cantidadCuaderno) + (precioLapicero * cantidadLapicero);
        document.write("Precio de cuadernos: " + precioCuaderno + "<br>");
        document.write("Cantidad de cuadernos: " + cantidadCuaderno + "<br>");
        document.write("Precio de lapiceros: " + precioLapicero + "<br>");
        document.write("Total: " + total);
    </script>
</body>
</html>
