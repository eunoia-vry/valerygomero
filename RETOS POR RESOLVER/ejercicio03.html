<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let  añoNacimiento= Number(prompt("Ingrese año de nacimiento: "));
        let  añoActual= Number(prompt("Ingrese de año actual: "));
        let  edadCalculada=añoActual-añoNacimiento;

        document.write("Año de nacimiento: "+añoNacimiento+"<br>");
        document.write("Año actual: "+ añoActual+"<br>");
        document.write("Edad calculada: "+ edadCalculada);
    </script>
</body>
</html>
