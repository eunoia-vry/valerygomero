<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let nota1= Number(prompt("Ingrese la primera nota: "));
        let nota2= Number(prompt("Ingrese la segunda nota: "));
        let nota3= Number(prompt("Ingrese la tercera nota: "));
        let promedioTotal = (nota1+nota2+nota3)/3;
        document.write("Primera nota: "+ nota1+"<br>");
        document.write("Segunda nota: "+nota2+"<br>");
        document.write("Tercera nota: "+nota3+"<br>");
        document.write("Promedio total: "+promedioTotal);
    </script>
</body>
</html>
