<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let precioGaseosa= Number(prompt("Marca de Ingrese precio de la gaseosa"));
        let cantidadGaseosa= Number(prompt("Ingrese la cantidad de gaseosas"));
        let total = precioGaseosa*cantidadGaseosa;
        
        document.write("Precio de gaseosa: " + precioGaseosa + "<br>");
        document.write("Cantidad de gaseosas: " + cantidadGaseosa + "<br>");
        document.write("Total: " + total);


    </script>
</body>

</html>
