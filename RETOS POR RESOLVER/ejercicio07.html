<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let sueldoTotal = Number(prompt("Ingrese el sueldo mensual: "));
        let montoDescontado = sueldoTotal * 13 / 100;
        let sueldoFinal = sueldoTotal - montoDescontado;

        document.write("Sueldo total: S/." + sueldoTotal + "<br>");
        document.write("Monto descontado: S/." + montoDescontado + "<br>");
        document.write("Sueldo final: S/." + sueldoFinal);
    </script>
</body>

</html>
