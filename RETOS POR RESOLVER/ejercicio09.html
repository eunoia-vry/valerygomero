<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let soles = Number(prompt("Ingrese el monto en soles: "));
        let tipoCambio = Number(prompt("Ingrese el tipo de cambio: "));
        let dolares = soles / tipoCambio;
        document.write("Monto en soles: S/ " + soles + "<br>");
        document.write("Tipo de cambio: " + tipoCambio + "<br>");
        document.write("Equivale a: $ " + dolares);
    </script>
</body>
</html>
